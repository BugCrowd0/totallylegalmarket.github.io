<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TLM / UPLOAD</title><link rel="stylesheet" href="style.css"></head>
<body><div class="noise"></div><header class="topbar"><a class="brand" href="index.html">TLM<span>_</span></a><nav><a href="index.html">HOME</a><a href="mods.html">MODS</a><a href="showcases.html">SHOWCASES</a><a class="active" href="upload.html">UPLOAD</a></nav><div class="account-links"><a class="account-link" href="profile.html">ACCOUNT</a></div></header>
<main class="page centered"><section class="auth-card upload-card"><p class="eyebrow">COMMUNITY / UPLOAD</p><h1>SHOWCASE A MOD</h1><p>UPLOAD A VIDEO SHOWING OFF YOUR MOD.</p><form id="uploadForm"><input id="title" type="text" placeholder="TITLE" maxlength="80" required><textarea id="description" placeholder="DESCRIPTION" maxlength="400"></textarea><input id="video" type="file" accept="video/mp4,video/webm,video/quicktime" required><button class="btn primary" type="submit">UPLOAD VIDEO →</button></form><div class="upload-note">Recommended: MP4 / WebM. Keep videos reasonably sized for your Supabase storage plan.</div><div id="uploadMessage" class="message"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="site.js"></script><script>
const form=document.getElementById('uploadForm'), msg=document.getElementById('uploadMessage');
(async()=>{if(!tlmRequireConfig())return; const {data:{user}}=await tlmSupabase.auth.getUser(); if(!user)location.href='login.html';})();
form.addEventListener('submit',async e=>{e.preventDefault(); if(!tlmRequireConfig())return; msg.textContent='UPLOADING...'; const {data:{user}}=await tlmSupabase.auth.getUser(); if(!user){location.href='login.html';return;} const file=document.getElementById('video').files[0]; const title=document.getElementById('title').value.trim(); const description=document.getElementById('description').value.trim(); if(!file)return; const ext=file.name.split('.').pop().toLowerCase(); const path=`${user.id}/${crypto.randomUUID()}.${ext}`;
  const {error:storageError}=await tlmSupabase.storage.from('showcase-videos').upload(path,file,{contentType:file.type,upsert:false}); if(storageError){msg.textContent=storageError.message;return;} const {error:dbError}=await tlmSupabase.from('showcases').insert({user_id:user.id,title,description,video_path:path,approved:true}); if(dbError){await tlmSupabase.storage.from('showcase-videos').remove([path]);msg.textContent=dbError.message;return;} msg.textContent='UPLOAD COMPLETE.'; form.reset(); setTimeout(()=>location.href='showcases.html',900);
});
</script></body></html>
