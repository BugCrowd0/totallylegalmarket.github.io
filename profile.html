<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TLM / ACCOUNT</title><link rel="stylesheet" href="style.css"></head>
<body><div class="noise"></div><header class="topbar"><a class="brand" href="index.html">TLM<span>_</span></a><nav><a href="index.html">HOME</a><a href="mods.html">MODS</a><a href="showcases.html">SHOWCASES</a><a href="upload.html">UPLOAD</a></nav><div class="account-links"><button class="text-button" id="logout">LOG OUT</button></div></header>
<main class="page"><section class="profile-head"><p class="eyebrow">ACCOUNT / PROFILE</p><h1 id="profileName">LOADING...</h1><p id="profileEmail"></p><div class="hero-buttons"><a class="btn primary" href="upload.html">UPLOAD SHOWCASE →</a></div></section><section class="section"><div class="section-head"><div><p class="eyebrow">YOUR POSTS</p><h2>MY <span>SHOWCASES</span></h2></div></div><div id="myShowcases" class="showcase-grid"></div></section></main>
<footer><div class="footer-logo">TLM_</div><p>© 2026 TOTALLYLEGALMARKET</p><a href="index.html">HOME ↑</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="site.js"></script><script>
(async()=>{if(!tlmRequireConfig())return; const {data:{user}}=await tlmSupabase.auth.getUser(); if(!user){location.href='login.html';return;} document.getElementById('profileEmail').textContent=user.email;
 const uname=user.user_metadata?.username || user.email.split('@')[0]; document.getElementById('profileName').textContent=uname.toUpperCase();
 const {data,error}=await tlmSupabase.from('showcases').select('id,title,description,video_path,created_at').eq('user_id',user.id).order('created_at',{ascending:false}); const box=document.getElementById('myShowcases'); if(error){box.innerHTML='<div class="empty-state">'+error.message+'</div>';return;} box.innerHTML=data.length?data.map(v=>`<article class="showcase-card"><video controls preload="metadata" src="${tlmSupabase.storage.from('showcase-videos').getPublicUrl(v.video_path).data.publicUrl}"></video><div class="showcase-card-body"><span class="eyebrow">${new Date(v.created_at).toLocaleDateString()}</span><h3>${escapeHtml(v.title)}</h3><p>${escapeHtml(v.description||'')}</p></div></article>`).join(''):'<div class="empty-state"><strong>NO SHOWCASES YET</strong><p>UPLOAD YOUR FIRST ONE.</p></div>'; function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
})(); document.getElementById('logout').addEventListener('click',async()=>{if(tlmSupabase){await tlmSupabase.auth.signOut();}location.href='index.html';});
</script></body></html>
