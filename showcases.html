<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TLM / SHOWCASES</title><link rel="stylesheet" href="style.css"></head>
<body><div class="noise"></div><header class="topbar"><a class="brand" href="index.html">TLM<span>_</span></a><nav><a href="index.html">HOME</a><a href="mods.html">MODS</a><a class="active" href="showcases.html">SHOWCASES</a><a href="upload.html">UPLOAD</a></nav><div class="account-links"><a class="account-link" href="login.html" id="accountLink">LOGIN</a></div></header>
<main class="page"><section class="page-hero"><p class="eyebrow">02 / COMMUNITY</p><h1>MOD <span>SHOWCASES</span></h1><p>WATCH WHAT THE COMMUNITY IS MAKING.</p><div class="hero-buttons"><a class="btn primary" href="upload.html">UPLOAD YOURS →</a></div></section><section class="section"><div id="showcaseGrid" class="showcase-grid"><div class="empty-state"><strong>LOADING</strong></div></div></section></main>
<footer><div class="footer-logo">TLM_</div><p>© 2026 TOTALLYLEGALMARKET</p><a href="index.html">HOME ↑</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="site.js"></script><script>
const box=document.getElementById('showcaseGrid');
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
(async()=>{if(!tlmRequireConfig())return; const {data,error}=await tlmSupabase.from('showcases').select('id,title,description,video_path,created_at,user_id').eq('approved',true).order('created_at',{ascending:false}); if(error){box.innerHTML='<div class="empty-state"><strong>DATABASE ERROR</strong><p>'+esc(error.message)+'</p></div>';return;} if(!data.length){box.innerHTML='<div class="empty-state"><strong>NO SHOWCASES YET</strong><p>BE THE FIRST TO POST ONE.</p></div>';return;} box.innerHTML=data.map(v=>{const url=tlmSupabase.storage.from('showcase-videos').getPublicUrl(v.video_path).data.publicUrl;return `<article class="showcase-card"><video controls preload="metadata" src="${url}"></video><div class="showcase-card-body"><span class="eyebrow">${new Date(v.created_at).toLocaleDateString()}</span><h3>${esc(v.title)}</h3><p>${esc(v.description)}</p></div></article>`}).join('');})();
</script></body></html>
