<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TLM / SHOWCASES</title><link rel="stylesheet" href="style.css"></head>
<body><div class="noise"></div><header class="topbar"><a class="brand" href="index.html">TLM<span>_</span></a><nav><a href="index.html">HOME</a><a href="mods.html">MODS</a><a class="active" href="showcases.html">SHOWCASES</a><a href="upload.html">SUBMIT</a></nav><div class="account-links"><a class="account-link" href="upload.html">SUBMIT</a><button class="menu" aria-label="Open menu">☰</button></div></header>
<main class="page"><section class="page-hero"><p class="eyebrow">02 / COMMUNITY</p><h1>MOD <span>SHOWCASES</span></h1><p>WATCH WHAT THE COMMUNITY IS MAKING.</p><div class="hero-buttons"><a class="btn primary" href="upload.html">SUBMIT YOURS →</a></div></section><section class="section"><div id="showcaseGrid" class="showcase-grid"><div class="empty-state"><strong>LOADING</strong></div></div></section></main>
<footer><div class="footer-logo">TLM_</div><p>© 2026 TOTALLYLEGALMARKET</p><a href="index.html">HOME ↑</a></footer><script src="site.js"></script><script>
const box=document.getElementById('showcaseGrid');
function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function hostLabel(url){try{const h=new URL(url).hostname.toLowerCase();if(h.includes('youtube.com')||h==='youtu.be')return 'YOUTUBE';if(h.includes('tiktok.com'))return 'TIKTOK';if(h.includes('drive.google.com')||h.includes('docs.google.com'))return 'GOOGLE DRIVE';if(h.includes('gofile.io'))return 'GOFILE';return 'OPEN LINK';}catch{return 'OPEN LINK';}}
(async()=>{try{const r=await fetch('showcases.json',{cache:'no-store'});if(!r.ok)throw new Error('Could not load showcases.json');const items=await r.json();if(!Array.isArray(items)||!items.length){box.innerHTML='<div class="empty-state"><strong>NO SHOWCASES YET</strong><p>SUBMIT ONE THROUGH OUR DISCORD SERVER.</p></div>';return;}box.innerHTML=items.slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0)).map(v=>`<article class="showcase-card"><div class="showcase-card-body"><span class="eyebrow">${esc(hostLabel(v.url))} / ${esc(v.createdAt?new Date(v.createdAt).toLocaleDateString():'COMMUNITY')}</span><h3>${esc(v.title||'MOD SHOWCASE')}</h3><p>${esc(v.description||'')}</p><p><strong>BY ${esc(v.username||'COMMUNITY MEMBER')}</strong></p><a class="btn primary" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">WATCH SHOWCASE ↗</a></div></article>`).join('');}catch(e){box.innerHTML='<div class="empty-state"><strong>SHOWCASES UNAVAILABLE</strong><p>Try again later.</p></div>';console.error(e);}})();
</script></body></html>
